name: Refinar icones da home para 64px

on:
  push:
    paths:
      - '.github/workflows/refinar-home-icons-64.yml'

permissions:
  contents: write

jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar Pillow
        run: python -m pip install --quiet Pillow

      - name: Reduzir icones da home para 64px
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          import re

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          pasta = Path('home-icons')
          arquivos = sorted(pasta.glob('*.webp'))
          if not arquivos:
              raise SystemExit('Nenhum icone encontrado em home-icons/')

          antes = 0
          depois = 0
          for p in arquivos:
              antes += p.stat().st_size
              with Image.open(p) as img:
                  img.load()
                  img.thumbnail((64, 64), Image.Resampling.LANCZOS)
                  img.save(p, 'WEBP', quality=72, method=6)
                  if img.width > 64 or img.height > 64:
                      raise SystemExit(f'Falha ao reduzir {p}')
              depois += p.stat().st_size
              print(f'{p.name}: {p.stat().st_size} bytes')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html2 = re.sub(
              r'(<img\b[^>]*src="home-icons/[^"]+\.webp"[^>]*?)\swidth="128"\sheight="128"',
              r'\1 width="64" height="64"',
              html,
              flags=re.I|re.S
          )
          refs = html2.count('src="home-icons/')
          dims = html2.count('width="64" height="64"')
          if refs != 22 or dims < 22:
              raise SystemExit(f'Validacao falhou: refs={refs}, dimensoes64={dims}')
          index.write_text(html2, encoding='utf-8')

          print(f'Total dos icones: {antes} -> {depois} bytes')
          PY

      - name: Salvar ajustes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-icons/ index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
            exit 0
          fi
          git commit -m "Reduz icones da home para 64px"
          git push
