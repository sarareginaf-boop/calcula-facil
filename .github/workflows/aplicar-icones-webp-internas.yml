name: Aplicar icones WebP nas paginas internas

on:
  push:
    paths:
      - '.github/workflows/aplicar-icones-webp-internas.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trocar referencias de icones PNG por WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          trocas = {
              'icone-area.png': 'icone-area.webp',
              'icone-comprimento.png': 'icone-comprimento.webp',
              'icone-concreto.png': 'icone-concreto.webp',
              'icone-culinaria.png': 'icone-culinaria.webp',
              'icone-datas.png': 'icone-datas.webp',
              'icone-economia.png': 'icone-economia.webp',
              'icone-fuso.png': 'icone-fuso.webp',
              'icone-idade.png': 'icone-idade.webp',
              'icone-juros.png': 'icone-juros.webp',
              'icone-moedas.png': 'icone-moedas.webp',
              'icone-peso.png': 'icone-peso.webp',
              'icone-piso.png': 'icone-piso.webp',
              'icone-porcentagem.png': 'icone-porcentagem.webp',
              'icone-regra.png': 'icone-regra.webp',
              'icone-temperatura.png': 'icone-temperatura.webp',
              'icone-tinta.png': 'icone-tinta.webp',
              'icone-viagem.png': 'icone-viagem.webp',
              'icone-volume.png': 'icone-volume.webp',
          }

          alterados = []
          for path in Path('.').glob('*.html'):
              texto = path.read_text(encoding='utf-8')
              novo = texto
              for antigo, webp in trocas.items():
                  novo = novo.replace(antigo, webp)
              novo = novo.replace('type="image/png" href="icone-porcentagem.webp"', 'type="image/webp" href="icone-porcentagem.webp"')
              if novo != texto:
                  path.write_text(novo, encoding='utf-8')
                  alterados.append(path.name)

          print('Arquivos alterados:', ', '.join(alterados) if alterados else 'nenhum')
          PY

      - name: Salvar alteracoes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
            exit 0
          fi
          git commit -m "Usa icones WebP nas paginas internas"
          git push
