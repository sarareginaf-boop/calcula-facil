name: Corrigir imagem interna de financas

on:
  push:
    paths:
      - '.github/workflows/corrigir-imagem-financas.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar Pillow
        run: python -m pip install --quiet Pillow

      - name: Converter imagem de financas para WebP
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          with Image.open('imagem-financas-v2.png') as img:
              img.save('imagem-financas-v2.webp', 'WEBP', quality=82, method=6)
          PY

      - name: Atualizar paginas internas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          economia = Path('economia.html')
          texto = economia.read_text(encoding='utf-8')
          texto = texto.replace('src="icone-economia.webp" alt="Cofrinho com moedas e seta de crescimento"', 'src="imagem-financas-v2.webp" alt="Ilustração de planejamento financeiro, economia e crescimento"')
          economia.write_text(texto, encoding='utf-8')

          conversor = Path('conversor.html')
          if conversor.exists():
              texto = conversor.read_text(encoding='utf-8')
              texto = texto.replace('imagem-financas-v2.png', 'imagem-financas-v2.webp')
              conversor.write_text(texto, encoding='utf-8')
          PY

      - name: Salvar correcao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagem-financas-v2.webp economia.html conversor.html
          git commit -m "Corrige e otimiza imagem interna de financas"
          git push
