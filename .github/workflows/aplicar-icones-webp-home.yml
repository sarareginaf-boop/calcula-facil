name: Aplicar icones WebP na home

on:
  push:
    paths:
      - '.github/workflows/aplicar-icones-webp-home.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trocar referencias PNG por WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          texto = path.read_text(encoding='utf-8')
          trocas = {
              'icone-temperatura.png': 'icone-temperatura.webp',
              'icone-comprimento.png': 'icone-comprimento.webp',
              'icone-peso.png': 'icone-peso.webp',
              'icone-area.png': 'icone-area.webp',
              'icone-volume.png': 'icone-volume.webp',
              'icone-viagem.png': 'icone-viagem.webp',
              'icone-economia.png': 'icone-economia.webp',
              'icone-datas.png': 'icone-datas.webp',
          }

          for antigo, novo in trocas.items():
              if antigo not in texto:
                  raise SystemExit(f'Referencia nao encontrada: {antigo}')
              texto = texto.replace(antigo, novo)

          path.write_text(texto, encoding='utf-8')
          PY

      - name: Salvar alteracao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Usa icones WebP restantes na pagina inicial"
          git push
