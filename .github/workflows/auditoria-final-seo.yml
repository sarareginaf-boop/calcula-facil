name: Auditoria final SEO

on:
  push:
    paths:
      - '.github/workflows/auditoria-final-seo.yml'

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Padronizar links da home e auditar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re, xml.etree.ElementTree as ET

          htmls = sorted(Path('.').glob('*.html'))
          alteradas = []

          # 1) Padroniza links internos para a home
          for p in htmls:
              txt = p.read_text(encoding='utf-8')
              novo = txt.replace('href="index.html"', 'href="/"').replace("href='index.html'", 'href="/"')
              if novo != txt:
                  p.write_text(novo, encoding='utf-8')
                  alteradas.append(p.name)

          # 2) Atualiza lastmod no sitemap para paginas alteradas
          sm = Path('sitemap.xml')
          smtxt = sm.read_text(encoding='utf-8')
          for nome in alteradas:
              loc = 'https://calculafacilweb.com.br/' if nome == 'index.html' else f'https://calculafacilweb.com.br/{nome}'
              pat = rf'(<url><loc>{re.escape(loc)}</loc><lastmod>)[^<]+(</lastmod></url>)'
              smtxt = re.sub(pat, r'\g<1>2026-09-16\g<2>', smtxt)
          sm.write_text(smtxt, encoding='utf-8')

          # 3) Auditoria das paginas publicas
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canon=[]
                  self.robots=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='link' and d.get('rel')=='canonical' and d.get('href'):
                      self.canon.append(d['href'])
                  if tag=='meta' and d.get('name','').lower()=='robots' and d.get('content'):
                      self.robots.append(d['content'].lower())

          erros=[]
          sitemap_root = ET.fromstring(sm.read_text(encoding='utf-8'))
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[u.find('s:loc',ns).text for u in sitemap_root.findall('s:url',ns)]
          if len(urls)!=27:
              erros.append(f'Sitemap deveria ter 27 URLs, encontrou {len(urls)}')

          publicas=[]
          for url in urls:
              if url.rstrip('/')=='https://calculafacilweb.com.br':
                  publicas.append('index.html')
              else:
                  publicas.append(url.rsplit('/',1)[-1])

          for nome in publicas:
              p=Path(nome)
              if not p.exists():
                  erros.append(f'Sitemap aponta para arquivo inexistente: {nome}')
                  continue
              txt=p.read_text(encoding='utf-8')
              parser=Parser(); parser.feed(txt)
              if len(parser.canon)!=1:
                  erros.append(f'{nome}: canonical esperado 1, encontrado {len(parser.canon)}')
              if any('noindex' in r for r in parser.robots):
                  erros.append(f'{nome}: pagina publica com noindex')

              scripts=re.findall(r'<script\s+type="application/ld\+json"[^>]*>(.*?)</script>', txt, flags=re.I|re.S)
              for i,s in enumerate(scripts,1):
                  try:
                      json.loads(s)
                  except Exception as e:
                      erros.append(f'{nome}: JSON-LD {i} invalido: {e}')

              for href in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\']', txt, flags=re.I):
                  if href.startswith(('#','mailto:','tel:','http://','https://','javascript:')) or href=='/':
                      continue
                  destino=href.split('#',1)[0].split('?',1)[0]
                  if destino and not Path(destino).exists():
                      erros.append(f'{nome}: link local quebrado -> {href}')

          # 4) pagina em revisao
          trab=Path('trabalhista.html')
          if trab.exists():
              t=trab.read_text(encoding='utf-8').lower()
              if 'noindex' not in t:
                  erros.append('trabalhista.html deveria permanecer noindex')
              if 'trabalhista.html' in sm.read_text(encoding='utf-8'):
                  erros.append('trabalhista.html nao deve estar no sitemap')

          # 5) nenhum link interno para index.html
          for p in htmls:
              txt=p.read_text(encoding='utf-8')
              if 'href="index.html"' in txt or "href='index.html'" in txt:
                  erros.append(f'{p.name}: ainda contem link para index.html')

          # 6) robots aponta para sitemap
          robots=Path('robots.txt').read_text(encoding='utf-8')
          if 'https://calculafacilweb.com.br/sitemap.xml' not in robots:
              erros.append('robots.txt nao aponta para sitemap.xml')

          print('Paginas com link da home padronizado:', len(alteradas))
          print('URLs publicas auditadas:', len(publicas))
          if erros:
              print('\nERROS ENCONTRADOS:')
              for e in erros:
                  print('-',e)
              raise SystemExit(1)
          print('AUDITORIA FINAL: OK')
          PY

      - name: Salvar ajustes finais
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
            exit 0
          fi
          git commit -m "Padroniza links da home e conclui auditoria SEO"
          git push
