name: Trocar icone IMC

on:
  push:
    paths:
      - '.github/workflows/trocar-icone-imc.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trocar apenas o icone de IMC
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          padrao = re.compile(
              r'(<a href="imc\.html".*?<img class="icone" src=")home-icons/icone-idade\.webp("[^>]*>Calculadora de\s*IMC)',
              re.S
          )
          novo, n = padrao.subn(r'\1home-icons/icone-imc.webp\2', html, count=1)
          if n != 1:
              raise SystemExit(f'Card de IMC nao foi atualizado: {n}')
          if novo.count('home-icons/icone-imc.webp') != 1:
              raise SystemExit('Validacao falhou: icone IMC deveria aparecer uma vez')
          p.write_text(novo, encoding='utf-8')
          print('Icone de IMC atualizado com sucesso.')
          PY

      - name: Salvar alteracao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige icone da calculadora de IMC"
          git push
