name: SEO tecnico final

on:
  push:
    paths:
      - '.github/workflows/seo-tecnico-final.yml'

permissions:
  contents: write

jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar Pillow
        run: python -m pip install --quiet Pillow

      - name: Aplicar otimizacoes tecnicas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          from urllib.parse import urlsplit
          import datetime
          import html as html_lib
          import json
          import re
          import subprocess
          import sys

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          raiz = Path('.')

          # 1) Converter ilustracoes PNG grandes para WebP
          convertidas = {}
          for origem in raiz.glob('imagem-*.png'):
              destino = origem.with_suffix('.webp')
              try:
                  with Image.open(origem) as img:
                      img.load()
                      img.save(destino, 'WEBP', quality=82, method=6)
                  convertidas[origem.name] = destino.name
                  print(f'WEBP: {origem.name} -> {destino.name} ({destino.stat().st_size} bytes)')
              except Exception as e:
                  print(f'Falha ao converter {origem}: {e}')
                  raise

          # 2) Trocar referencias para WebP em HTML e CSS/JS quando houver arquivo convertido
          textuais = list(raiz.glob('*.html')) + list(raiz.glob('*.css')) + list(raiz.glob('*.js'))
          for arq in textuais:
              texto = arq.read_text(encoding='utf-8')
              novo = texto
              for antigo, webp in convertidas.items():
                  novo = novo.replace(antigo, webp)
              if novo != texto:
                  arq.write_text(novo, encoding='utf-8')

          # Helpers
          def atributo(tag, nome):
              m = re.search(rf'\b{re.escape(nome)}\s*=\s*["\']([^"\']+)["\']', tag, re.I)
              return m.group(1) if m else None

          def arquivo_local(url):
              if not url:
                  return None
              u = url.strip()
              if u.startswith(('http://','https://','//','data:','mailto:','tel:','javascript:','#')):
                  return None
              path = urlsplit(u).path.lstrip('/')
              if not path:
                  return None
              return Path(path)

          # 3) Adicionar width/height a imagens locais usando dimensoes reais
          for arq in raiz.glob('*.html'):
              texto = arq.read_text(encoding='utf-8')

              def ajustar_img(m):
                  tag = m.group(0)
                  src = atributo(tag, 'src')
                  p = arquivo_local(src)
                  if not p or not p.exists():
                      return tag
                  if re.search(r'\bwidth\s*=', tag, re.I) and re.search(r'\bheight\s*=', tag, re.I):
                      return tag
                  try:
                      with Image.open(p) as img:
                          w, h = img.size
                  except Exception:
                      return tag
                  extras = ''
                  if not re.search(r'\bwidth\s*=', tag, re.I):
                      extras += f' width="{w}"'
                  if not re.search(r'\bheight\s*=', tag, re.I):
                      extras += f' height="{h}"'
                  if tag.endswith('/>'):
                      return tag[:-2].rstrip() + extras + ' />'
                  return tag[:-1].rstrip() + extras + '>'

              novo = re.sub(r'<img\b[^>]*>', ajustar_img, texto, flags=re.I|re.S)
              if novo != texto:
                  arq.write_text(novo, encoding='utf-8')

          # 4) Dados estruturados WebApplication nas calculadoras publicas
          calculadoras = {
              'area.html','cientifica.html','comprimento.html','concreto.html','conversor.html',
              'culinaria.html','datas.html','economia.html','financiamento.html','fuso.html',
              'idade.html','imc.html','juros-compostos.html','peso.html','piso-rejunte.html',
              'porcentagem.html','regra-de-tres.html','rodape.html','temperatura.html','tinta.html',
              'viagem.html','volume.html'
          }

          for nome in calculadoras:
              p = raiz / nome
              texto = p.read_text(encoding='utf-8')
              if '"@type": "WebApplication"' in texto or '"@type":"WebApplication"' in texto:
                  continue

              mt = re.search(r'<title>(.*?)</title>', texto, re.I|re.S)
              md = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', texto, re.I|re.S)
              mc = re.search(r'<link\s+rel=["\']canonical["\']\s+href=["\'](.*?)["\']', texto, re.I|re.S)
              if not (mt and md and mc):
                  raise SystemExit(f'Faltam title/description/canonical em {nome}')

              titulo = html_lib.unescape(re.sub(r'\s*\|\s*Calcula Fácil\s*$', '', mt.group(1).strip()))
              descricao = html_lib.unescape(md.group(1).strip())
              canonical = mc.group(1).strip()
              schema = {
                  '@context': 'https://schema.org',
                  '@type': 'WebApplication',
                  'name': titulo,
                  'url': canonical,
                  'description': descricao,
                  'applicationCategory': 'UtilitiesApplication',
                  'operatingSystem': 'Any',
                  'isAccessibleForFree': True,
                  'inLanguage': 'pt-BR',
                  'publisher': {
                      '@type': 'Organization',
                      'name': 'Simpliva Labs'
                  }
              }
              bloco = '<script type="application/ld+json">' + json.dumps(schema, ensure_ascii=False, separators=(',', ':')) + '</script>'
              texto = re.sub(r'</head>', bloco + '</head>', texto, count=1, flags=re.I)
              p.write_text(texto, encoding='utf-8')

          # 5) og:image absoluto usando a primeira imagem da area hero, quando ainda nao houver
          for p in raiz.glob('*.html'):
              if p.name == 'trabalhista.html':
                  continue
              texto = p.read_text(encoding='utf-8')
              if 'property="og:image"' in texto or "property='og:image'" in texto:
                  continue
              mhero = re.search(r'<section\b[^>]*class=["\'][^"\']*hero[^"\']*["\'][^>]*>.*?<img\b[^>]*src=["\']([^"\']+)["\']', texto, re.I|re.S)
              if not mhero:
                  continue
              src = mhero.group(1)
              local = arquivo_local(src)
              if not local or not local.exists():
                  continue
              meta = f'<meta property="og:image" content="https://calculafacilweb.com.br/{src}" />'
              texto = re.sub(r'</head>', meta + '</head>', texto, count=1, flags=re.I)
              p.write_text(texto, encoding='utf-8')

          # 6) Remover PNGs convertidos somente se nenhuma referencia textual restar
          for antigo, webp in convertidas.items():
              origem = raiz / antigo
              referencias = []
              for arq in list(raiz.glob('*.html')) + list(raiz.glob('*.css')) + list(raiz.glob('*.js')) + [raiz/'sitemap.xml']:
                  if arq.exists() and antigo in arq.read_text(encoding='utf-8'):
                      referencias.append(arq.name)
              if referencias:
                  print(f'Mantido {antigo}; ainda referenciado em {referencias}')
              elif origem.exists():
                  origem.unlink()
                  print(f'Removido PNG antigo: {antigo}')

          # 7) Atualizar lastmod do sitemap com data real por arquivo; arquivos alterados hoje recebem hoje
          sitemap = raiz / 'sitemap.xml'
          xml = sitemap.read_text(encoding='utf-8')
          alterados = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          hoje = datetime.date.today().isoformat()

          def data_arquivo(nome):
              if nome in alterados:
                  return hoje
              try:
                  d = subprocess.check_output(['git','log','-1','--format=%cs','--',nome], text=True).strip()
                  return d or hoje
              except Exception:
                  return hoje

          def ajustar_url(m):
              bloco = m.group(0)
              locm = re.search(r'<loc>https://calculafacilweb\.com\.br/(.*?)</loc>', bloco)
              if not locm:
                  return bloco
              rota = locm.group(1)
              nome = 'index.html' if rota == '' else rota
              if not (raiz / nome).exists():
                  return bloco
              data = data_arquivo(nome)
              if re.search(r'<lastmod>.*?</lastmod>', bloco):
                  bloco = re.sub(r'<lastmod>.*?</lastmod>', f'<lastmod>{data}</lastmod>', bloco)
              else:
                  bloco = bloco.replace('</url>', f'<lastmod>{data}</lastmod></url>')
              return bloco

          xml = re.sub(r'<url>.*?</url>', ajustar_url, xml, flags=re.S)
          sitemap.write_text(xml, encoding='utf-8')

          # 8) Auditoria de referencias locais em HTML/CSS
          faltando = []
          for p in raiz.glob('*.html'):
              texto = p.read_text(encoding='utf-8')
              for tag, attr in [('img','src'),('script','src'),('link','href'),('a','href')]:
                  for m in re.finditer(rf'<{tag}\b[^>]*\b{attr}\s*=\s*["\']([^"\']+)["\']', texto, re.I|re.S):
                      u = m.group(1)
                      alvo = arquivo_local(u)
                      if not alvo:
                          continue
                      # Links sem extensao nao sao usados neste site; diretorios sao aceitos
                      if not alvo.exists():
                          faltando.append(f'{p.name}: {u}')

          for p in raiz.glob('*.css'):
              texto = p.read_text(encoding='utf-8')
              for m in re.finditer(r'url\(["\']?([^"\')]+)', texto, re.I):
                  alvo = arquivo_local(m.group(1))
                  if alvo and not alvo.exists():
                      faltando.append(f'{p.name}: {m.group(1)}')

          if faltando:
              print('REFERENCIAS LOCAIS QUEBRADAS:')
              for x in faltando:
                  print(' -', x)
              sys.exit(1)

          print('Auditoria concluida: nenhuma referencia local quebrada encontrada.')
          PY

      - name: Salvar ajustes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
            exit 0
          fi
          git commit -m "Finaliza SEO tecnico e otimiza recursos"
          git push
