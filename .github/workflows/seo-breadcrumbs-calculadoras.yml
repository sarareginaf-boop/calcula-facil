name: SEO breadcrumbs calculadoras

on:
  push:
    paths:
      - '.github/workflows/seo-breadcrumbs-calculadoras.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adicionar BreadcrumbList
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          paginas = [
            'area.html','cientifica.html','comprimento.html','concreto.html','conversor.html',
            'culinaria.html','datas.html','economia.html','financiamento.html','fuso.html',
            'idade.html','imc.html','juros-compostos.html','peso.html','piso-rejunte.html',
            'porcentagem.html','regra-de-tres.html','rodape.html','temperatura.html','tinta.html',
            'viagem.html','volume.html'
          ]

          alteradas = 0
          for nome in paginas:
              p = Path(nome)
              html = p.read_text(encoding='utf-8')
              if '"@type":"BreadcrumbList"' in html or '"@type": "BreadcrumbList"' in html:
                  print(f'{nome}: breadcrumb ja existe')
                  continue

              mt = re.search(r'<title>(.*?)</title>', html, re.S)
              mc = re.search(r'<link\s+rel="canonical"\s+href="([^"]+)"', html, re.I)
              if not mt or not mc:
                  raise SystemExit(f'{nome}: title/canonical ausente')
              titulo = re.sub(r'\s*\|\s*Calcula Fácil\s*$', '', mt.group(1)).strip()
              canonical = mc.group(1)

              data = {
                '@context':'https://schema.org',
                '@type':'BreadcrumbList',
                'itemListElement':[
                  {'@type':'ListItem','position':1,'name':'Calcula Fácil','item':'https://calculafacilweb.com.br/'},
                  {'@type':'ListItem','position':2,'name':titulo,'item':canonical}
                ]
              }
              script = '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False, separators=(',',':')) + '</script>'
              if '</head>' not in html:
                  raise SystemExit(f'{nome}: head nao encontrado')
              html = html.replace('</head>', script + '</head>', 1)
              p.write_text(html, encoding='utf-8')
              alteradas += 1

          if alteradas == 0:
              print('Nenhuma pagina precisava de breadcrumb.')
          else:
              print(f'Breadcrumbs adicionados em {alteradas} paginas.')
          PY

      - name: Salvar alteracoes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
            exit 0
          fi
          git commit -m "Adiciona breadcrumbs estruturados nas calculadoras"
          git push
