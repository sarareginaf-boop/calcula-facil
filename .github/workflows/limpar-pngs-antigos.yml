name: Limpar PNGs antigos

on:
  push:
    paths:
      - '.github/workflows/limpar-pngs-antigos.yml'

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover somente arquivos antigos sem referencias
        shell: bash
        run: |
          set -e
          candidatos=(
            icone-area.png
            icone-comprimento.png
            icone-datas.png
            icone-economia.png
            icone-peso.png
            icone-porcentagem.png
            icone-temperatura.png
            icone-viagem.png
            icone-volume.png
            imagem-financas-v2.png
          )

          for arquivo in "${candidatos[@]}"; do
            if [ ! -f "$arquivo" ]; then
              echo "Ignorado: $arquivo nao existe"
              continue
            fi

            if git grep -n -F "$arquivo" -- ':!*.png' ':!*.jpg' ':!*.webp' ':!.github/workflows/*' >/tmp/ref.txt 2>/dev/null; then
              echo "Mantido: $arquivo ainda possui referencia"
              cat /tmp/ref.txt
            else
              echo "Removendo: $arquivo"
              git rm "$arquivo"
            fi
          done

      - name: Salvar limpeza
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nenhum PNG antigo pode ser removido com seguranca."
            exit 0
          fi
          git commit -m "Remove PNGs antigos ja substituidos"
          git push
