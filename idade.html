<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calculadora de Idade e Signo | Calcula Fácil</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topo">
      <a class="marca" href="index.html">Calcula <span>Fácil</span></a>
      <p>Ferramentas simples para decisões do dia a dia</p>
    </header>
    <main>
      <section class="hero hero-ferramenta">
        <div>
          <p class="etiqueta">FERRAMENTA GRATUITA</p>
          <h1>Calculadora de idade e signo</h1>
          <p>
            Descubra sua idade exata, signo e quantos dias faltam para o próximo
            aniversário.
          </p>
        </div>
        <img
          src="imagem-dia-a-dia.png"
          alt="Ilustração de calendário e aniversário"
        />
      </section>
      <section class="grade">
        <form id="idade" class="cartao">
          <h2>Data de nascimento</h2>
          <label
            >Informe sua data<input
              id="nascimento"
              type="date"
              required /></label
          ><button>Calcular minha idade</button>
        </form>
        <section class="cartao resultado">
          <h2>Seu resultado</h2>
          <div id="iResultado">Informe sua data de nascimento.</div>
        </section>
      </section>
    </main>
    <footer>© <span class="ano"></span> Calcula Fácil</footer>
    <script src="idade.js"></script>
  </body>
</html>
